<ol class="bag" [attr.aria-label]="label()">
  @for (slot of slots(); track $index) {
    <li
      class="sw-inset"
      [class.occupied]="!!slot"
      [title]="slot ? name(slot.item) + ' (' + slot.quantity + ')' : 'Empty slot'"
    >
      <span class="slot-number" aria-hidden="true">{{ $index + 1 }}</span>
      @if (slot) {
        <app-item-sprite [item]="slot.item" [size]="48" />
        <span class="sw-visually-hidden">{{ name(slot.item) }}</span
        ><strong>{{ slot.quantity }}</strong>
      } @else {
        <span class="empty">Empty</span>
      }
    </li>
  }
</ol>
