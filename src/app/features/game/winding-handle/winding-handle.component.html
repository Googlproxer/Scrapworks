<button
  type="button"
  class="crank"
  data-winding
  aria-label="Wind MiniFab handle"
  aria-describedby="winding-help"
  (pointerdown)="start($event)"
  (pointermove)="move($event)"
  (pointerup)="release()"
  (pointercancel)="release()"
  (lostpointercapture)="release()"
  (blur)="release()"
  (keydown)="key($event)"
  (keyup)="key($event)"
>
  <span class="caster" aria-hidden="true"
    ><span class="moving" [style.transform]="'rotate(' + (angle() + 45) + 'deg)'"
      ><span class="arm"></span><span class="grip"></span></span
  ></span>
</button>
<p id="winding-help">
  Turn to charge.<span class="sw-visually-hidden">
    Drag around the pivot, rotate the selected right stick, or press your winding direction keys
    while focused here. Five turns fill the battery; either direction works. Holding still adds no
    charge. Winding is optional.</span
  >
</p>
