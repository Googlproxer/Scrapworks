name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NG_CLI_ANALYTICS: 'false'

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Enable the project's pinned Yarn version
        run: |
          corepack enable
          yarn --version

      # setup-node queries Yarn for its cache directory, so enable Corepack first.
      - name: Restore Yarn download cache
        uses: actions/setup-node@v7
        with:
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Install Chromium and Linux browser dependencies
        run: yarn playwright install --with-deps chromium --only-shell

      # A clean checkout has neither public/scene nor src/scripts.ts.
      - name: Export authored scenes
        run: yarn scenes:export

      - name: Lint application and templates
        run: yarn lint

      - name: Typecheck and test development tools
        run: yarn test:coverage:tools

      - name: Check documentation links and diagrams
        run: yarn docs:check

      - name: Typecheck and test game simulation and sessions
        run: yarn test:game --coverage

      - name: Run Chromium application and accessibility tests
        run: yarn test --configuration=coverage

      - name: Build production application
        run: yarn build --stats-json

      # Inspect the production build graph only; this does not run benchmarks.
      - name: Enforce production worker/main dependency separation
        run: |
          node tools/architecture/check.ts
          node tools/ecs-bench/verify-production.ts
          node tools/architecture/bundle.ts

      # Virtual/full gameplay playthroughs are local-only; never add them to CI (AGENTS.md).
      - name: Exercise the built simulation worker and failure Retry
        run: |
          yarn test:acceptance
          yarn test:acceptance --render-delay-ms=1000

      - name: Verify gameplay saves through IndexedDB and page reload
        run: yarn test:saves

      - name: Verify research queue and legacy save continuation
        run: yarn test:research

      - name: Verify exported and built assets
        run: yarn assets:check --build

      - name: Verify development reload and export recovery
        run: yarn test:workflow

      - name: Summarize game and tooling coverage
        run: yarn coverage:report

      - name: Upload game coverage
        uses: actions/upload-artifact@v7
        with:
          name: game-coverage
          path: coverage/game/
          if-no-files-found: error
          retention-days: 7

      - name: Upload tooling coverage
        uses: actions/upload-artifact@v7
        with:
          name: tooling-coverage
          path: coverage/tooling/
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: |
            tmp/workflow-browser/
            .vitest/
            tmp/production-worker-browser/
            tmp/save-browser/
            tmp/research-browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: scrapworks-production
          path: dist/scrapworks/browser/
          if-no-files-found: error
          retention-days: 7
