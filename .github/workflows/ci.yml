name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NG_CLI_ANALYTICS: 'false'

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Enable the project's pinned Yarn version
        run: |
          corepack enable
          yarn --version

      # Native packages must not cross OS images or Node versions. Package manifests
      # include the local portal dependency; no stale-key fallback is used here.
      - name: Identify runner image
        id: platform
        run: echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: installed-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.image }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'tools/editor-mcp/package.json', '.yarn/patches/**') }}

      # setup-node queries Yarn for its cache directory, so enable Corepack first.
      - name: Restore Yarn download cache
        uses: actions/setup-node@v7
        with:
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: yarn install --immutable

      # Save immediately after a verified install, before tools can change the tree.
      # Only master seeds this large cache; PRs can reuse it without duplicating it.
      - name: Save installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Install Chromium and Linux browser dependencies
        run: yarn playwright install --with-deps chromium --only-shell

      # A clean checkout has neither public/scene nor src/scripts.ts.
      - name: Export authored scenes
        run: yarn scenes:export

      - name: Lint application and templates
        run: yarn lint

      - name: Typecheck and test development tools
        run: yarn test:coverage:tools

      - name: Check documentation links and diagrams
        run: yarn docs:check

      - name: Typecheck and test game simulation and sessions
        run: yarn test:game --coverage

      - name: Run focused Chromium application and accessibility coverage
        run: yarn test:ci

      - name: Build production application
        run: yarn build:prod:stats

      # Inspect the production build graph only; this does not run benchmarks.
      - name: Enforce production worker/main dependency separation
        run: |
          node tools/architecture/check.ts
          node tools/ecs-bench/verify-production.ts
          node tools/architecture/bundle.ts

      # Real-renderer, loading/stall, save/research and dev-reload diagnostics are
      # local-only. Keep this bounded worker fixture; never add gameplay routes.
      - name: Smoke-test the built simulation worker with a small fixture
        run: yarn test:worker:smoke

      - name: Verify exported and built assets
        run: yarn assets:check --build

      - name: Summarize game and tooling coverage
        run: yarn coverage:report

      - name: Upload game coverage
        uses: actions/upload-artifact@v7
        with:
          name: game-coverage
          path: coverage/game/
          if-no-files-found: error
          retention-days: 7

      - name: Upload tooling coverage
        uses: actions/upload-artifact@v7
        with:
          name: tooling-coverage
          path: coverage/tooling/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failed focused browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: .vitest/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: scrapworks-production
          path: dist/scrapworks/browser/
          if-no-files-found: error
          retention-days: 7
